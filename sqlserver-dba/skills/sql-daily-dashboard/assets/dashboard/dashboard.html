    const st = o.stmts.length ? o.stmts.map((s, si) => '<div class="stmt"><div class="sh"><span class="mono"><b>query_id ' + esc(s.query_id) + '</b></span><span class="mono muted">' + esc(s.query_hash || '') + '</span>' +
      '<span><b>' + cpu(+s.cpu_c || 0) + '</b> ' + UL() + ' (' + cpu(+s.cpu_a || 0) + ' wk ago)</span><span>' + ms(s.cpu_ms_c) + ' ms each (' + ms(s.cpu_ms_a) + ')</span><span>' + nf(s.execs_c) + ' calls (' + nf(s.execs_a) + ')</span>' +
      '<span>plans <b>' + ((+s.plans_c || 0) >= 3 ? '<span class="chip watch">' + nf(s.plans_c) + '</span>' : nf(s.plans_c)) + '</b> today, ' + nf(s.plans_a) + ' wk ago</span>' + (s.reads_per_c != null ? '<span>' + nf(s.reads_per_c) + ' reads each</span>' : '') + '</div>' +
      '<details' + (si === 0 ? ' open' : '') + '><summary>' + esc(String(s.sql_text || '').replace(/\s+/g, ' ').trim().slice(0, 150)) + '</summary><pre class="code">' + esc(String(s.sql_text || '').trim()) + '</pre></details></div>').join('')
      : '<div class="empty">No statement detail for this object.</div>';
    const stmts = '<div class="panel box"><h3>Statements</h3><div class="win">Top statements by CPU today; today (week ago). Click a statement for its text.</div>' + st + '</div>';
    const prompt = DashModel.drillPrompt(M, db, o), params = DashModel.scriptParams(o), row = candidateRow(db, o);
    const ask = '<div class="panel box"><div class="box-head"><h3>Request for Claude</h3>' + copyBtn(prompt, 'Copy request', 'pri') + '</div><div class="win">Paste in Claude Code to start the read-only analysis</div><pre class="code">' + esc(prompt) + '</pre></div>';
    const scripts = '<div class="panel box"><h3>Script parameters</h3><div class="win">EDIT ME values for the ' + esc(meta.drill.skill || 'analysis') + ' scripts' + (meta.drill.scripts ? ' in <span class="mono">' + esc(meta.drill.scripts) + '</span>' : '') + '</div>' +
      (params.length ? params.map(p => '<div class="param"><span class="s mono">' + esc(p.script) + '</span><code>' + esc(p.edit) + '</code>' + copyBtn(p.edit, 'Copy') + '</div>').join('') : '<div class="empty">No parameters for this object.</div>') + '</div>';
    const fields = cand ? '<dl class="fields"><dt>Status</dt><dd><span class="chip st-' + cand.status + '">' + esc(cand.status === 'ready' ? 'ready to deploy' : cand.status) + '</span></dd>' + (o.owner ? '<dt>Owner</dt><dd><b>' + esc(o.owner) + '</b></dd>' : '') + '<dt>Item</dt><dd>' + esc(plain(cand.item)) + '</dd>' +
      (cand.fields || []).filter(f => !/^owner$/i.test(f.name)).map(f => '<dt>' + esc(f.name) + '</dt><dd>' + esc(plain(f.value)) + '</dd>').join('') + '</dl>' : '<div class="empty" style="padding:4px 0">Not on the candidate list. This row is ready for the Open table:</div>';
    const candBox = '<div class="panel box"><div class="box-head"><h3>Candidate list</h3>' + copyBtn(row, 'Copy as a candidate row') + '</div>' + fields + '<pre class="code" style="max-height:120px">' + esc(row) + '</pre></div>';
    const el = document.getElementById('drill');
    el.innerHTML = '<div class="dr-head"><div class="dr-bar"><span class="kick">Drill-down · ' + esc(db.name) + ' · ' + esc(o.grp) + ' · ' + esc(o.kind) + '</span>' +
      '<button type="button" class="btn" data-close aria-label="Close the drill-down (Esc)">Close ✕</button></div>' +
      '<h2 id="dr-title" tabindex="-1">' + esc(o.obj) + '</h2><div class="tags">' + tags + '</div>' +
      '<div class="dr-bar dr-acts">' + navA(prev, '← Prev', 'Previous') + navA(next, 'Next →', 'Next') +
      '<span class="pos" title="' + esc(pos.t) + '">' + esc(pos.txt) + '</span>' +
      copyBtn(location.href.split('#')[0] + hashObj(db, o), 'Copy link') + copyBtn(prompt, 'Copy request') + copyBtn(row, 'Copy as a candidate row') + '</div></div>' +
      '<div class="dr-body">' + sigs + nums + shape + stmts + ask + scripts + candBox + '</div>';
  }

  // ---- routing: #view=<view>&db=<database>&grp=<integration>&unit=pct&drill=<database>|<object>
  function readHash(src) {
    const out = { view: 'today', db: null, grp: '', drill: null, unit: null };
    (src == null ? location.hash : src).replace(/^#/, '').split('&').forEach(p => {
      const i = p.indexOf('='); if (i < 0) return;
      const k = p.slice(0, i), v = p.slice(i + 1);
      const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
      if (k === 'view' && VIEWS.some(x => x.k === v)) out.view = v;
      else if (k === 'db') out.db = dec(v);
      else if (k === 'grp') out.grp = dec(v);
      else if (k === 'unit') out.unit = v === 'pct' ? 'pct' : 'min';
      else if (k === 'drill') {
        const m = v.match(/\||%7C/i); if (!m) return;
        out.drill = { db: dec(v.slice(0, m.index)), obj: dec(v.slice(m.index + m[0].length)) };
      }
    });
    return out;
  }
  function hashText() {
    const p = [];
    if (state.view !== 'today') p.push('view=' + state.view);
    if (state.db !== 0 && !state.drill) p.push('db=' + encodeURIComponent(cur().name));
    if (state.view === 'objects' && state.obj.grp) p.push('grp=' + encodeURIComponent(state.obj.grp));
    if (isPct()) p.push('unit=pct');
    if (state.drill) p.push('drill=' + encodeURIComponent(state.drill.db) + '|' + encodeURIComponent(state.drill.obj));
    return p.join('&');
  }
  function writeHash(push) {
    const h = hashText(), url = location.pathname + location.search + (h ? '#' + h : '');
    if (('#' + h) === location.hash || (!h && !location.hash)) return;
    try { history[push ? 'pushState' : 'replaceState'](null, '', url); } catch (e) { location.hash = h; }
  }
  // CPU-min or % of server: every view and an open drill-down redraw; the choice is kept for this viewer
  function setUnit(u) {
    u = u === 'pct' ? 'pct' : 'min';
    if (u === state.unit) return;
    state.unit = u;
    try { localStorage.setItem('dash.unit', u); } catch (e) { /* private window: the link still carries it */ }
    renderAll();
    if (state.drill) renderDrill(M.dbs[state.db], M.dbs[state.db].objects.find(x => x.obj === state.drill.obj));
  }
  function setDb(i) {
    if (i === state.db) return;
    state.db = i; setGrp(''); state.obj.flags = {}; state.obj.sel = null;
    renderAll();
  }
  // An integration filter shows all of that integration's objects by CPU today, done ones included, so nothing
  // drops to the bottom just because its score is zero; clearing it goes back to the model's order.
  function setGrp(grp) {
    state.obj.grp = grp;
    state.obj.scope = grp ? 'all' : 'focus';
    state.obj.sort = grp ? { k: 'c', dir: -1 } : { k: 'score', dir: -1 };
  }
  function showView(v, focusTab) {
    state.view = v;
    VIEWS.forEach(x => { document.getElementById('view-' + x.k).hidden = x.k !== v; });
    renderTabs();
    if (focusTab) { const t = document.getElementById('tab-' + v); if (t) t.focus(); }
  }
  function openDrill(dbName, objName) {
    const di = M.dbs.findIndex(d => d.name === dbName);
    const o = di >= 0 ? M.dbs[di].objects.find(x => x.obj === objName) : null;
    if (!o) { closeDrill(); return false; }
    if (di !== state.db) setDb(di);
    const was = state.drill;
    state.drill = { db: M.dbs[di].name, obj: o.obj };
    state.obj.sel = o.obj;
    renderDrill(M.dbs[di], o);
    const el = document.getElementById('drill');
    el.hidden = false; el.scrollTop = 0; document.body.classList.add('drilling');
    markSel();
    if (!was) { const t = document.getElementById('dr-title'); if (t) t.focus({ preventScroll: true }); }
    return true;
  }
  function closeDrill() {
    const was = state.drill;
    state.drill = null;
    document.getElementById('drill').hidden = true; document.body.classList.remove('drilling');
    markSel();
    if (was) { const back = document.querySelector('[data-obj="' + (window.CSS && CSS.escape ? CSS.escape(was.obj) : was.obj) + '"]'); if (back && back.offsetParent) back.focus({ preventScroll: true }); }
  }
  function markSel() {
    const sel = state.drill ? state.drill.obj : null;
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.obj === sel));
    document.querySelectorAll('#otbl tbody tr[data-obj]').forEach(r => r.classList.toggle('sel', r.dataset.obj === state.obj.sel));
  }
  // apply the hash to the page (load, back/forward, typed links)
  function route() {
    const h = readHash();
    if (h.unit) setUnit(h.unit);
    if (h.drill) { const di = M.dbs.findIndex(d => d.name === h.drill.db); if (di >= 0) setDb(di); }
    else if (h.db) { const di = M.dbs.findIndex(d => d.name === h.db); if (di >= 0) setDb(di); }
    if (h.view === 'objects' && h.grp !== state.obj.grp) { setGrp(h.grp); renderObjects(); }
    showView(h.view);
    if (h.drill) { if (!openDrill(h.drill.db, h.drill.obj)) writeHash(false); } else if (state.drill) closeDrill();
  }
  function go(changes, push) {
    if (changes.db != null) setDb(changes.db);
    if (changes.grp != null) { setGrp(changes.grp); renderObjects(); }
    if (changes.view) showView(changes.view, changes.focusTab);
    if (changes.drill === null) closeDrill();
    writeHash(push !== false);
  }

  // printed pages after the stand-up sheet: top objects (the model's opportunities) and statement movers, per database
  function renderPrintExtra() {
    const row = (d, o, i) => '<tr><td class="n muted">' + (i + 1) + '</td><td class="o">' + esc(o.obj) + '</td><td>' + esc(o.grp) + '</td><td>' + stageChip(o) + '</td><td>' + esc(o.owner || (o.stage === 'untracked' ? '' : 'unassigned')) + '</td>' +
      '<td class="n"><b>' + cpu(o.c.cpu_min) + '</b></td><td class="n muted">' + cpu(o.a.cpu_min) + '</td><td class="n">' + dlt(o.c.cpu_min, o.a.cpu_min) + '</td><td>' + esc(why(o, 2).join(', ')) + '</td></tr>';
    document.getElementById('print-extra').innerHTML = M.dbs.map(d =>
      '<div class="pg"><div class="sect-head"><h2>Top objects · ' + esc(d.name) + '</h2><span class="hint">the model\'s opportunity list, ' + winTxt() + ' today vs the same hours a week ago, ' + UH() + '</span></div>' +
      '<div class="panel box"><table class="rows"><thead><tr><th class="n">#</th><th>Object</th><th>Integration</th><th>Stage</th><th>Owner</th><th class="n">Today</th><th class="n">Week ago</th><th class="n">Δ week</th><th>Worse because</th></tr></thead><tbody>' +
      d.opportunities.map((o, i) => row(d, o, i)).join('') + '</tbody></table></div>' +
      '<div class="sect-head"><h2>Statement movers · ' + esc(d.name) + '</h2><span class="hint">net per object, statements that moved by 5 CPU-min or more</span></div><div class="panel box">' + moversTable(d) + '</div></div>').join('');
  }

  function renderAll() {
    renderHeader(); renderVerdict(); renderBoardSummary(); renderKpis(); renderHealth(); renderTabs();
    renderToday(); renderBoard(); renderObjects(); renderChanges(); renderPrintExtra();
    document.getElementById('foot').textContent = 'Windows: today ' + meta.day_c + ' ' + winTxt() + ' (last complete hour); week ago ' + meta.day_a + ' and baseline ' + meta.day_b + ' over the same hours. ' +
      'CPU from Query Store in CPU-minutes; cores = CPU-min ÷ minutes in the window' + (NCPU ? '; % of server = cores ÷ ' + NCPU + ' logical CPUs (scores, copied requests and candidate rows always use CPU-min)' : '') + '. Data as of ' + String(meta.generated || '').replace('T', ' ') + '; ' +
      M.dbs.map(d => d.name + ' sampled ' + String(d.meta.now_local || '').replace('T', ' ').slice(0, 16)).join(', ') + '. Read-only collection. Printing gives a one-page stand-up sheet, then optional pages with top objects and statement movers per database.';
    markSel();
  }

  // ---- copy: hidden textarea and the copy command only (works on file:// pages and in mailed copies)
  function doCopy(text, btn) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    const label = btn.dataset.label;
    btn.textContent = ok ? 'Copied ✓' : 'Copy blocked: select the text';
    setTimeout(() => { btn.textContent = label; }, 1600);
  }

  // ---- events
  // a drill-down link opens the panel over the current view (the href is still the shareable deep link)
  function drillTo(dbName, objName, push) { if (openDrill(dbName, objName)) writeHash(push); }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#drill="]');
    if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
      const h = readHash(a.getAttribute('href'));
      if (h.drill) { e.preventDefault(); drillTo(h.drill.db, h.drill.obj, !a.hasAttribute('data-nav')); return; }
    }
    const t = e.target.closest('[data-copy],[data-more],[data-db],[data-close],[data-view],[data-grp],[data-unit],[data-heat],[data-health],[data-scope],[data-flag],th[data-sort],#otbl tbody tr[data-obj],tr[data-open]');
    if (!t) return;
    if (t.hasAttribute('data-copy')) return doCopy(copyTexts[+t.dataset.copy], t);
    if (t.hasAttribute('data-more')) { state.boardMore[t.dataset.more] = !state.boardMore[t.dataset.more]; renderBoard(); markSel(); return; }
    if (t.hasAttribute('data-db')) { go({ db: +t.dataset.db, drill: null }); return; }
    if (t.hasAttribute('data-close')) { go({ drill: null }); return; }
    if (t.hasAttribute('data-view')) {
      go({ view: t.dataset.view });
      if (t.hasAttribute('data-jump')) { const bar = document.querySelector('.tabbar'); window.scrollTo(0, bar.offsetTop); }
      return;
    }
    if (t.hasAttribute('data-grp')) { e.preventDefault(); go({ view: 'objects', grp: t.dataset.grp }); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-unit')) { setUnit(t.dataset.unit); writeHash(false); return; }
    if (t.hasAttribute('data-heat')) { state.heat = t.dataset.heat; document.getElementById('heatbox').innerHTML = heatmap(cur()); return; }
    if (t.hasAttribute('data-health')) { state.healthOpen = !state.healthOpen; renderHealth(); return; }
    if (t.hasAttribute('data-scope')) { state.obj.scope = t.dataset.scope; renderObjects(); return; }
    if (t.hasAttribute('data-flag')) { const f = t.dataset.flag; state.obj.flags[f] = !state.obj.flags[f]; renderObjects(); return; }
    if (t.matches('th[data-sort]')) { const k = t.dataset.sort, s = state.obj.sort; state.obj.sort = s.k === k ? { k, dir: -s.dir } : { k, dir: ['obj', 'grp', 'st', 'ow'].indexOf(k) >= 0 ? 1 : -1 }; renderTable(); return; }
    if (t.matches('#otbl tbody tr[data-obj]') || t.matches('tr[data-open]')) {
      if (e.target.closest('a')) return;
      const name = t.dataset.obj || t.dataset.open;
      if (state.drill && state.drill.obj === name) go({ drill: null }); else drillTo(cur().name, name, true);
    }
  });
  document.addEventListener('change', e => { if (e.target.id === 'grpSel') { go({ grp: e.target.value }, false); } });
  document.addEventListener('input', e => { if (e.target.id === 'q') { state.obj.q = e.target.value; renderTable(); } });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
    if (e.key === 'Escape') { if (typing) { e.target.blur(); return; } if (state.drill) { e.preventDefault(); go({ drill: null }); } return; }
    if (typing || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.getAttribute && e.target.getAttribute('role') === 'tab' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      const i = VIEWS.findIndex(v => v.k === state.view), n = VIEWS[(i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length];
      e.preventDefault(); go({ view: n.k, focusTab: true }); return;
    }
    if (/^[1-4]$/.test(e.key)) { go({ view: VIEWS[+e.key - 1].k }); return; }
    if (state.view !== 'objects') return;
    if (e.key === '/') { e.preventDefault(); const q = document.getElementById('q'); if (q) q.focus(); return; }
    const rows = state.obj.rows;
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && rows.length) {
      e.preventDefault();
      let i = rows.findIndex(o => o.obj === state.obj.sel);
      i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
      state.obj.sel = rows[i].obj; markSel();
      const r = document.querySelector('#otbl tbody tr.sel'); if (r) { r.focus({ preventScroll: true }); r.scrollIntoView({ block: 'nearest' }); }
      if (state.drill) drillTo(cur().name, rows[i].obj, false);
    } else if (e.key === 'Enter' && state.obj.sel && !(e.target.closest && e.target.closest('a,button'))) {
      e.preventDefault();
      if (state.drill) go({ drill: null }); else drillTo(cur().name, state.obj.sel, true);
    }
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);

  const tip = document.getElementById('tip');
  document.addEventListener('mousemove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - r.width - 8, e.clientX + 14) + 'px';
    tip.style.top = Math.max(8, e.clientY - r.height - 10) + 'px';
  });

  // the unit comes from the link first, then this viewer's last choice
  state.unit = readHash().unit || (() => { try { return localStorage.getItem('dash.unit'); } catch (e) { return null; } })() || 'min';
  renderAll();
  route();
})();
</script>
